<section #heroSection class="hero-section relative flex items-center overflow-hidden"
    style="min-height: calc(100vh - 64px);">
    <div class="hero-glow absolute rounded-full pointer-events-none"
        style="width:700px;height:700px;top:50%;right:-5%;transform:translateY(-50%);"></div>
    <div class="hero-scanlines absolute inset-0 pointer-events-none z-0"></div>
    <div class="relative z-10 w-full px-4 md:px-[60px] lg:px-[100px]
            flex flex-col-reverse lg:flex-row items-center
            gap-8 sm:gap-12 lg:gap-0
            pt-20 sm:pt-24 lg:pt-0  
            pb-14 sm:pb-16 lg:py-0">
        <div class="flex flex-col w-full lg:w-[58%]" style="gap:28px;">
            <div class="hero-fade-1 flex justify-center lg:justify-start">
                <div class="hero-badge flex items-center gap-2 px-3 py-[6px] rounded-full w-fit">
                    <span class="hero-badge-dot w-[6px] h-[6px] rounded-full"></span>
                    <span
                        class="font-['DM_Mono',monospace] text-[9px] tracking-[3px] uppercase font-semibold text-[#c8f03d]">
                        Remote Only Opportunities
                    </span>
                </div>
            </div>
            <div class="hero-fade-4 flex flex-col text-center lg:text-left" style="gap:6px;">
                <h1 class="hero-headline font-['DM_Mono',monospace] leading-[1.25] tracking-[-0.02em]"
                    style="font-size:clamp(22px,3.5vw,38px); font-weight:700;">
                   Frontend Engineer building<br>
                    <span class="hero-accent">production-grade web applications</span><br>
                    <span style="font-size:0.72em; font-weight:700; letter-spacing:0.01em;">
                        and scalable systems
                    </span>
                </h1>
            </div>
            <div #typewriterEl class="hero-fade-3 flex items-center gap-3 justify-center lg:justify-start">
                <div class="hero-tw-track w-8 h-px flex-shrink-0"></div>
                <span class="typewriter-slash font-['DM_Mono',monospace] text-[12px] sm:text-[13px]">~/</span>
                <span class="typewriter-text font-['DM_Mono',monospace] text-[12px] sm:text-[13px]">{{ currentRole
                    }}</span>
                <span class="typewriter-cursor w-[2px] h-[15px] rounded-sm bg-[#c8f03d]"></span>
            </div>
            <div class="hero-fade-5 hero-divider w-12 h-px mx-auto lg:mx-0"></div>
            <div class="hero-fade-6 flex items-center gap-4 justify-center lg:justify-start flex-wrap">
                <a href="#projects" class="hero-cta-primary group relative flex items-center gap-3 overflow-hidden
                 font-['DM_Mono',monospace] text-[10px] tracking-[2.5px] uppercase font-semibold
                 px-6 py-[13px] rounded-lg transition-all duration-300">
                    <span class="hero-cta-sweep absolute inset-0 translate-x-[-101%] group-hover:translate-x-0
                       transition-transform duration-300 ease-[cubic-bezier(0.4,0,0.2,1)]"></span>
                    <svg class="relative z-10 w-[13px] h-[13px] hero-cta-icon transition-all duration-300
                      group-hover:translate-x-[2px]" viewBox="0 0 14 14" fill="none">
                        <path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span class="relative z-10 hero-cta-label transition-colors duration-300">See My Work</span>
                </a>
                <div class="relative group">
                    <a href="images/CV Moseri Mathebe Conny.pdf" download class="hero-cv-btn flex items-center justify-center w-11 h-11 rounded-lg
                   transition-all duration-200 group-hover:scale-105">
                        <svg class="w-[15px] h-[15px] hero-cv-icon
                        transition-transform duration-300 group-hover:translate-y-[2px]" viewBox="0 0 16 16"
                            fill="none">
                            <path d="M8 2v9M4 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M2 14h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                        </svg>
                    </a>
                    <div class="hero-tooltip absolute bottom-[calc(100%+10px)] left-0
            pointer-events-none whitespace-nowrap
            font-['DM_Mono',monospace]  text-[6px] sm:text-[8px] md:text-[9px]  tracking-[2px] uppercase
            px-3 py-[7px] rounded-md
            opacity-0 translate-y-1
            group-hover:opacity-100 group-hover:translate-y-0
            transition-all duration-200

            md:opacity-0 md:group-hover:opacity-100  
            opacity-100 translate-y-0                
">
                        Download CV
                        <span class="hero-tooltip-arrow absolute top-full left-0
                         border-[5px] border-transparent"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="hero-fade-2 flex items-center justify-center w-full lg:w-[42%]">
            <div class="relative">
                <div class="absolute rounded-full border pointer-events-none hero-ring hero-ring-1 hero-ring-accent"
                    style="inset:-20px;"></div>
                <div class="absolute rounded-full border pointer-events-none hero-ring hero-ring-2 hero-ring-subtle"
                    style="inset:-42px;"></div>
                <div class="absolute rounded-full border pointer-events-none hero-ring hero-ring-3 hero-ring-faint"
                    style="inset:-66px;"></div>
                <canvas #avatarCanvas class="rounded-full avatar-canvas" style="cursor:grab;display:block;"></canvas>
                <div class="avatar-platform"></div>
                <div class="absolute top-[8px] right-[8px] w-3 h-3">
                    <div class="absolute top-0 right-0 w-3 h-[2px] rounded-sm corner-accent"></div>
                    <div class="absolute top-0 right-0 w-[2px] h-3 rounded-sm corner-accent"></div>
                </div>
                <div class="absolute bottom-[8px] left-[8px] w-3 h-3">
                    <div class="absolute bottom-0 left-0 w-3 h-[2px] rounded-sm corner-accent"></div>
                    <div class="absolute bottom-0 left-0 w-[2px] h-3 rounded-sm corner-accent"></div>
                </div>
                <p class="drag-hint absolute -bottom-7 left-1/2 -translate-x-1/2
                  font-['DM_Mono',monospace] text-[8px] tracking-[2.5px] uppercase whitespace-nowrap">
                    drag to rotate
                </p>
            </div>
        </div>
    </div>
</section>
