<!-- Add this inside <head> -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<section class="contact-section" id="contact">

  <h2 class="section-title">
    Let's <span class="accent">build something.</span>
  </h2>

  <div class="contact-grid">

    <!-- ── Left: Social Icons ───────────────────────── -->
    <div class="social-icons">

      <!-- Gmail -->
      <a
        href="mailto:mathebemoseri@gmail.com"
        class="icon gmail"
        data-label="mathebemoseri@gmail.com"
      >
        <i class="fa-solid fa-envelope"></i>
      </a>

      <!-- WhatsApp -->
      <a
        href="https://wa.me/27765956598"
        target="_blank"
        class="icon whatsapp"
        data-label="+27 76 595 6598"
      >
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <!-- LinkedIn -->
      <a
        href="https://www.linkedin.com/in/mathebemoseri/"
        target="_blank"
        class="icon linkedin"
        data-label="linkedin.com/in/mathebemoseri"
      >
        <i class="fa-brands fa-linkedin"></i>
      </a>

      <!-- GitHub -->
      <a
        href="https://github.com/mathebe-moseri"
        target="_blank"
        class="icon github"
        data-label="github.com/mathebe-moseri"
      >
        <i class="fa-brands fa-github"></i>
      </a>

    </div>

    <!-- ── Middle: Contact Form ────────────────────── -->
    <div class="form-panel">

      <div class="corner corner-tl"></div>
      <div class="corner corner-br"></div>

      <!-- Success -->
      <div class="status-box status-success" *ngIf="status === 'success'">
        Message sent. I'll get back to you shortly.
      </div>

      <!-- Error -->
      <div class="status-box status-error" *ngIf="status === 'error'">
        Something went wrong. Try emailing directly instead.
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" *ngIf="status !== 'success'">

        <div class="field-row">

          <div class="field">
            <label for="c-name">Name</label>
            <input
              id="c-name"
              type="text"
              placeholder="Your name"
              [(ngModel)]="formData.name"
              name="name"
              required
            />
          </div>

          <div class="field">
            <label for="c-email">Email</label>
            <input
              id="c-email"
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="formData.email"
              name="email"
              required
            />
          </div>

        </div>

        <div class="field">
          <label for="c-subject">Subject</label>
          <input
            id="c-subject"
            type="text"
            placeholder="Remote opportunity / Collaboration / Other"
            [(ngModel)]="formData.subject"
            name="subject"
          />
        </div>

        <div class="field">
          <label for="c-message">Message</label>
          <textarea
            id="c-message"
            placeholder="Describe what you're building or what you need..."
            [(ngModel)]="formData.message"
            name="message"
            required
          ></textarea>
        </div>

        <button
          class="btn-submit"
          type="submit"
          [disabled]="isSubmitting"
        >
          Send message
        </button>

      </form>

    </div>

    <!-- ── Right: Image ────────────────────────────── -->
    <div class="contact-image">
      <img
        src="images/me.png"
        alt="Contact Illustration"
      />
    </div>

  </div>

</section>
<footer class="portfolio-footer">
  © 2026 Mathebe Moseri. All rights reserved.
</footer>
